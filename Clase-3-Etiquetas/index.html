<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primera pagina web</title>
</head>
<body>
    <!--
    heading: encabezados
    h1 ... h6
    
    si usas un h3 debe existir en la pagina un h1 y un h2,
    no se puede saltar de h1 a h3
    -->
    <h1>Hello world</h1>
    <h2>Que tal?</h2>
    <button>Click</button>

    <p>Esto es una nueva funcionalidad</p>
    <button>Test</button>
    <li></li>

    <h2>Tu carrito</h2>
    <hr>
    <span>Pan KG *2 </span>
    <br>
    <span>Precio unitario: $3000 ARS</span>
    <hr>
    <span>Total: $6000 ARS</span>
</body>
</html>
