<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My feedback form</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>My feedback form</h1>

    <form>
      <ul>
        <li>
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" class="txt" />
        </li>
        <li>
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" class="txt" />
        </li>
        <li>
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" class="txt" />
        </li>
      </ul>

      <p>Please check all the emotions that apply to you:</p>
      <ul>
        <li>
          <label><input type="checkbox" name="emotion" value="angry" checked /> Angry</label>
        </li>
        <li>
          <label><input type="checkbox" name="emotion" value="sad" /> Sad</label>
        </li>
        <li>
          <label><input type="checkbox" name="emotion" value="happy" /> Happy</label>
        </li>
        <li>
          <label><input type="checkbox" name="emotion" value="ambivalent" /> Ambivalent</label>
        </li>
      </ul>

      <p>How satisfied were you with our service?</p>
      <ul>
        <li>
          <label><input type="radio" name="satisfaction" value="very-satisfied" checked /> Very satisfied</label>
        </li>
        <li>
          <label><input type="radio" name="satisfaction" value="satisfied" /> Satisfied</label>
        </li>
        <li>
          <label><input type="radio" name="satisfaction" value="didnt-care" /> Didn't care</label>
        </li>
        <li>
          <label><input type="radio" name="satisfaction" value="dissatisfied" /> Dissatisfied</label>
        </li>
        <li>
          <label><input type="radio" name="satisfaction" value="very-dissatisfied" /> Very dissatisfied</label>
        </li>
      </ul>

      <p>
        <label for="comments">Further comments:</label><br />
        <textarea id="comments" name="comments" rows="4" cols="40"></textarea>
      </p>

      <p>
        <label for="photo">Bio photo:</label>
        <input type="file" id="photo" name="photo" class="photo" />
      </p>

      <p>
        <label for="location">Location visited:</label>
        <select id="location" name="location">
          <option value="">Select location</option>
          <option value="madrid">Madrid</option>
          <option value="barcelona">Barcelona</option>
          <option value="sevilla">Sevilla</option>
          <option value="valencia">Valencia</option>
        </select>
      </p>

      <button type="submit">submit</button>
    </form>
  </body>
</html>
